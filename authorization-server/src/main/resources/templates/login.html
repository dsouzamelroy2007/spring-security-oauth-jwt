<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Expense Tracker - Sign in</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
        form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); width: 20rem; }
        h1 { font-size: 1.25rem; margin: 0 0 1rem; }
        label { display: block; font-size: .85rem; margin-top: .75rem; }
        input { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; }
        button { width: 100%; margin-top: 1.25rem; padding: .6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .alert { padding: .5rem .75rem; border-radius: 4px; margin-bottom: 1rem; font-size: .85rem; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
<form method="post" th:action="@{/login}">
    <h1>Expense Tracker</h1>
    <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus/>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required/>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
