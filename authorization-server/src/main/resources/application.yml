spring:
  application:
    name: authorization-server

  datasource:
    # Host port 5433, not 5432: this dev machine already runs a native Postgres
    # service on 5432. See docker-compose.yml.
    url: jdbc:postgresql://localhost:5433/expensetracker
    username: expensetracker
    password: expensetracker

  jpa:
    hibernate:
      # Flyway is the single source of schema truth. "update" or "create" here
      # would let Hibernate silently alter the schema out from under Flyway's
      # migration history, masking real migration bugs instead of failing loudly.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Namespaced, not the default classpath:db/migration: integration-tests
    # boots this app and resource-server in one JVM, both jars on one
    # classpath -- with the default location, Flyway's classpath scan finds
    # both modules' "V1" and refuses to start ("Found more than one migration
    # with version 1"). Postgres dialect comes from the flyway-database-postgresql
    # runtime dependency.
    locations: classpath:db/migration/authserver

server:
  port: 9000

app:
  security:
    # RSA signing key rotation interval (ISO-8601 duration). See
    # config/jwk/JwkSourceConfig — a new key becomes the signer, the previous
    # one is retained just long enough for already-issued tokens to still verify.
    jwk-rotation-interval: P7D
  oauth2:
    issuer: http://localhost:9000
    # Audience for access tokens meant to be presented to the Expense Tracker
    # API. Not id_tokens -- those are consumed by the client itself, which
    # authenticates via client_id, not an audience claim. Must match
    # resource-server's app.security.expected-audience.
    resource-audience: expense-tracker-api
