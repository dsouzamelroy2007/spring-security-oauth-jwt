name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- gitleaks scans full git history, not just this
      # checkout's default shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn -B verify

      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: dependency-check-nvd-

      # No nvdApiKey secret: works without one, just at a slower default NVD
      # rate limit on a cold cache -- never a required credential.
      - name: OWASP dependency-check
        run: mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Trivy filesystem/dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
